name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpforge:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5","8.6"]'
      dependency_versions: '["prefer-lowest","prefer-stable"]'
      fail_on_skipped_tests: true
      integration_services: '["sqlite","redis","mysql","mariadb","postgres"]'
      service_topologies: '{}'
      benchmark_composer_script: 'benchmark:ci'
      benchmark_result_file: 'build/benchmark-result.json'
      benchmark_max_regression_percent: 2

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  documentation:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: Documentation build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build Sphinx documentation
        run: python -m sphinx -W --keep-going -b html docs "$RUNNER_TEMP/otp-docs"

  sustained-performance:
    if: github.event_name == 'pull_request'
    name: Sustained performance gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OTP_PERF_BASELINE_SHA: df54c49b823c6beaad65cc2f829fb8b9c6502236
      OTP_BENCHMARK_RUNNER: github-actions-paired
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Checkout pre-Runwire baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.OTP_PERF_BASELINE_SHA }}
          path: baseline

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        shell: bash
        run: |
          composer update --working-dir=baseline --no-dev --no-interaction --prefer-dist --no-progress --prefer-stable
          composer update --working-dir=candidate --no-dev --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Run paired sustained and integration benchmarks
        shell: bash
        run: |
          mkdir -p perf
          php -d auto_prepend_file="$GITHUB_WORKSPACE/baseline/vendor/autoload.php" candidate/benchmarks/release-gate.php \
            --autoload="$GITHUB_WORKSPACE/baseline/vendor/autoload.php" \
            --release="$OTP_PERF_BASELINE_SHA" \
            --duration=15 \
            --repetitions=3 \
            --stable > "$GITHUB_WORKSPACE/perf/baseline.json"
          php -d auto_prepend_file="$GITHUB_WORKSPACE/candidate/vendor/autoload.php" candidate/benchmarks/release-gate.php \
            --autoload="$GITHUB_WORKSPACE/candidate/vendor/autoload.php" \
            --release="$GITHUB_SHA" \
            --duration=15 \
            --repetitions=3 \
            --stable > "$GITHUB_WORKSPACE/perf/candidate.json"
          php -d auto_prepend_file="$GITHUB_WORKSPACE/baseline/vendor/autoload.php" candidate/benchmarks/release-gate.php \
            --autoload="$GITHUB_WORKSPACE/baseline/vendor/autoload.php" \
            --release="$OTP_PERF_BASELINE_SHA" \
            --duration=15 \
            --repetitions=3 \
            --stable \
            --workload=roundtrip > "$GITHUB_WORKSPACE/perf/baseline-roundtrip.json"
          php -d auto_prepend_file="$GITHUB_WORKSPACE/candidate/vendor/autoload.php" candidate/benchmarks/release-gate.php \
            --autoload="$GITHUB_WORKSPACE/candidate/vendor/autoload.php" \
            --release="$GITHUB_SHA" \
            --duration=15 \
            --repetitions=3 \
            --stable \
            --workload=roundtrip > "$GITHUB_WORKSPACE/perf/candidate-roundtrip.json"
          php -d auto_prepend_file="$GITHUB_WORKSPACE/candidate/vendor/autoload.php" candidate/benchmarks/release-gate.php \
            --autoload="$GITHUB_WORKSPACE/candidate/vendor/autoload.php" \
            --release="$GITHUB_SHA" \
            --repetitions=3 \
            --workload=cold-start > "$GITHUB_WORKSPACE/perf/cold-start.json"

      - name: Calibrate and compare paired four-worker SQLite trials
        shell: bash
        run: |
          python3 candidate/benchmarks/sqlite-acceptance.py \
            --baseline="$GITHUB_WORKSPACE/baseline" \
            --candidate="$GITHUB_WORKSPACE/candidate" \
            --harness="$GITHUB_WORKSPACE/candidate/benchmarks/release-gate.php" \
            --baseline-release="$OTP_PERF_BASELINE_SHA" \
            --candidate-release="$GITHUB_SHA" \
            --output="$GITHUB_WORKSPACE/perf"

      - name: Install PHPForge validation tooling
        run: composer update --working-dir=candidate --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Run persistent Runwire lifecycle benchmark
        shell: bash
        run: |
          php -d auto_prepend_file="$GITHUB_WORKSPACE/candidate/vendor/autoload.php" candidate/benchmarks/release-gate.php \
            --autoload="$GITHUB_WORKSPACE/candidate/vendor/autoload.php" \
            --release="$GITHUB_SHA" \
            --duration=8 \
            --repetitions=3 \
            --stable \
            --workload=runwire-lifecycle > "$GITHUB_WORKSPACE/perf/runwire-lifecycle.json"

      - name: Validate representative benchmark results
        shell: bash
        run: |
          for result in "$GITHUB_WORKSPACE"/perf/*.json; do
            composer --working-dir=candidate ic:benchmark:validate "$result"
          done

      - name: Enforce 2 percent successful-RPM budget
        shell: bash
        run: |
          comparison_status=0
          for suffix in '' '-roundtrip' '-concurrent'; do
            if ! composer --working-dir=candidate ic:benchmark:compare \
              "$GITHUB_WORKSPACE/perf/baseline${suffix}.json" \
              "$GITHUB_WORKSPACE/perf/candidate${suffix}.json" \
              --max-regression=2 \
              --stable-environment; then
              comparison_status=1
            fi
          done
          # A/A must be stable and within budget in either direction.
          for arm in a b; do
            other=b
            if [[ "$arm" == b ]]; then other=a; fi
            if ! composer --working-dir=candidate ic:benchmark:compare \
              "$GITHUB_WORKSPACE/perf/aa-baseline-$arm.json" \
              "$GITHUB_WORKSPACE/perf/aa-baseline-$other.json" \
              --max-regression=2 --stable-environment; then
              comparison_status=1
            fi
          done
          exit "$comparison_status"

      - name: Prepare the matching Runwire 3 HTTP host baseline
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          composer require --working-dir=baseline --dev 'infocyph/runwire:^3.0' --no-update --no-interaction
          composer update --working-dir=baseline --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Compare validated HTTP requests and soak the persistent host
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 candidate/benchmarks/http-acceptance.py \
            --baseline="$GITHUB_WORKSPACE/baseline" \
            --candidate="$GITHUB_WORKSPACE/candidate" \
            --output="$GITHUB_WORKSPACE/perf/http" \
            --duration=30 \
            --warmup=10 \
            --repetitions=4 \
            --soak-duration=300 \
            --concurrency 1 8 32

      - name: Upload sustained benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sustained-performance-results
          path: |
            perf/*.json
            perf/http/*.json
            perf/http/*-server.log
            perf/sqlite-trials/
          retention-days: 61
          if-no-files-found: error

  http-attribution:
    if: github.event_name == 'pull_request'
    name: HTTP performance attribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      OTP_PERF_BASELINE_SHA: df54c49b823c6beaad65cc2f829fb8b9c6502236
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.OTP_PERF_BASELINE_SHA }}
          path: baseline
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Install matched HTTP host dependencies
        shell: bash
        run: |
          mkdir -p attribution
          composer require --working-dir=baseline --dev 'infocyph/runwire:^3.0' --no-update --no-interaction
          composer update --working-dir=baseline --no-interaction --prefer-dist --no-progress --prefer-stable
          composer update --working-dir=candidate --no-interaction --prefer-dist --no-progress --prefer-stable
          composer show --working-dir=baseline --format=json > attribution/baseline-packages.json
          composer show --working-dir=candidate --format=json > attribution/candidate-packages.json
      - name: Measure paired HTTP attribution workloads
        shell: bash
        run: |
          for mode in full no-context memory memory-no-context transport; do
            python3 candidate/benchmarks/http-acceptance.py \
              --baseline="$GITHUB_WORKSPACE/baseline" \
              --candidate="$GITHUB_WORKSPACE/candidate" \
              --output="$GITHUB_WORKSPACE/attribution/$mode" \
              --workload="$mode" --diagnostic \
              --duration=15 --warmup=5 --repetitions=4 --concurrency 8 32
          done
      - name: Summarize attribution
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('attribution').glob('*/http-acceptance.json')):
              data = json.loads(path.read_text())
              for concurrency, comparison in data['comparisons'].items():
                  base = data['baseline'][concurrency]
                  candidate = data['candidate'][concurrency]
                  print(path.parent.name, 'C' + concurrency,
                        f"baseline={base['median_successful_rpm']:.0f}",
                        f"candidate={candidate['median_successful_rpm']:.0f}",
                        f"regression={comparison['regression_percent']:.2f}%",
                        f"CV={base['cv_percent']:.2f}/{candidate['cv_percent']:.2f}%")
          PY
      - name: Upload attribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: http-performance-attribution
          path: attribution/
          retention-days: 61
          if-no-files-found: error
